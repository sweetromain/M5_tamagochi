; Jeu de créature virtuelle pour M5StickC Plus2
[platformio]
default_envs = m5stick-c-plus2

[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = huge_app.csv   ; 3 Mo pour le programme (les sprites prennent ~1 Mo)
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.2
build_flags =
  -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
extra_scripts = pre:tools/pio_prebuild.py

; Tests de la logique sur PC : pio test -e native
[env:native]
platform = native
build_src_filter = +<Pet.cpp>
test_build_src = yes
build_flags = -std=c++17
